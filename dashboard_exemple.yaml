# Replace using search and replace xxxxxx with your installation number from the iConnect app or the LCD Working status

title: Domusa MQTT Bridge
views:
  - title: Overview
    path: domusa-mqtt
    icon: mdi:heat-pump
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Operation Status
            icon: mdi:heat-pump
          - type: entities
            title: Operating Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_heating_active
                name: Heating Active
              - entity: binary_sensor.xxxxxx_dhw_preparation
                name: DHW Preparation
              - entity: binary_sensor.xxxxxx_defrost_active
                name: Defrost Active (C33)
              - entity: binary_sensor.xxxxxx_compressor_enabled
                name: Compressor
              - entity: binary_sensor.xxxxxx_zone_1_demand
                name: Zone 1 Demand
              - entity: binary_sensor.xxxxxx_sg_ready_active
                name: SG Ready
          - type: entities
            title: DHW Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_dhw_enabled
                name: DHW Enabled
              - entity: binary_sensor.xxxxxx_dhw_preparation
                name: DHW Currently Preparing
              - entity: sensor.xxxxxx_dhw_temperature
                name: DHW Temperature
          - type: gauge
            entity: sensor.xxxxxx_compressor_frequency
            name: Compressor Frequency
            min: 0
            max: 85
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 75

      - type: grid
        cards:
          - type: heading
            heading: Heating & Hydraulic Circuit
            icon: mdi:radiator
          - type: entities
            title: Live Temperatures
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_flow_temperature
                name: Actual Flow Temperature
              - entity: sensor.xxxxxx_return_temperature
                name: Actual Return Temperature
              - entity: sensor.domusa_delta_t
                name: Delta T
              - entity: sensor.xxxxxx_water_flow
                name: Water Flow
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor Temperature
          - type: entities
            title: Heating Curve / OTC
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_otc_enabled
                name: OTC Enabled
              - entity: sensor.xxxxxx_otc_curve
                name: OTC Curve
              - entity: sensor.xxxxxx_otc_requested_temperature
                name: Requested Temperature
              - entity: sensor.xxxxxx_p06_heating_cooling_hysteresis
                name: Heating/Cooling Hysteresis
          - type: history-graph
            title: Flow, Return & Delta T — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.xxxxxx_flow_temperature
                name: Flow
              - entity: sensor.xxxxxx_return_temperature
                name: Return
              - entity: sensor.domusa_delta_t
                name: Delta T
              - entity: sensor.xxxxxx_otc_requested_temperature
                name: Requested

      - type: grid
        cards:
          - type: heading
            heading: Defrost Monitoring
            icon: mdi:snowflake-melt
          - type: entities
            title: Live Defrost Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_defrost_active
                name: Defrost Active (C33)
              - entity: sensor.xxxxxx_evaporator_temperature
                name: Evaporator Temperature
              - entity: sensor.xxxxxx_suction_temperature
                name: Suction Temperature
              - entity: sensor.xxxxxx_condenser_temperature
                name: Condensing Temperature
              - entity: sensor.xxxxxx_compressor_frequency
                name: Compressor Frequency
              - entity: sensor.xxxxxx_fan_1_speed
                name: Fan 1 Speed
          - type: history-graph
            title: Defrost Periods (C33) — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 30
            entities:
              - entity: binary_sensor.xxxxxx_defrost_active
                name: C33 Defrost

      - type: grid
        cards:
          - type: heading
            heading: Refrigerant Circuit
            icon: mdi:snowflake-thermometer
          - type: entities
            title: Refrigerant Measurements
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_high_refrigerant_pressure
                name: High Refrigerant Pressure
              - entity: sensor.xxxxxx_evaporator_temperature
                name: Evaporating Temperature
              - entity: sensor.xxxxxx_condenser_temperature
                name: Condensing Temperature
              - entity: sensor.xxxxxx_suction_temperature
                name: Suction Temperature
              - entity: sensor.xxxxxx_discharge_temperature
                name: Discharge Temperature

      - type: grid
        cards:
          - type: heading
            heading: Electrical & Fans
            icon: mdi:lightning-bolt
          - type: entities
            title: Electrical Measurements
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_ac_voltage
                name: AC Voltage
              - entity: sensor.xxxxxx_compressor_current
                name: Compressor Current
              - entity: sensor.xxxxxx_compressor_phase_current
                name: Compressor Phase Current
          - type: entities
            title: Fans
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_fan_1_speed
                name: Fan 1 Speed
              - entity: sensor.2510533897_fan_1_speed
                name: Fan 2 Speed

  - title: Diagnostics
    path: domusa-diagnostics
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Operating Diagnostics
        show_header_toggle: false
        entities:
          - entity: binary_sensor.xxxxxx_heating_active
            name: Heating Active
          - entity: binary_sensor.xxxxxx_dhw_preparation
            name: DHW Preparation
          - entity: binary_sensor.xxxxxx_defrost_active
            name: Defrost Active (C33)
          - entity: binary_sensor.xxxxxx_compressor_enabled
            name: Compressor Enabled
          - entity: binary_sensor.xxxxxx_zone_1_demand
            name: Zone 1 Demand
      - type: history-graph
        title: Defrost Periods (C33) — Last 7 Days
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: binary_sensor.xxxxxx_defrost_active
            name: C33 Defrost
      - type: entities
        title: Compressor Diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.xxxxxx_compressor_frequency
            name: Frequency
          - entity: sensor.xxxxxx_compressor_current
            name: Current
          - entity: sensor.xxxxxx_compressor_phase_current
            name: Phase Current
      - type: entities
        title: Refrigerant Diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.xxxxxx_high_refrigerant_pressure
            name: High Pressure
          - entity: sensor.xxxxxx_evaporator_temperature
            name: Evaporator
          - entity: sensor.xxxxxx_condenser_temperature
            name: Condenser
          - entity: sensor.xxxxxx_suction_temperature
            name: Suction
          - entity: sensor.xxxxxx_discharge_temperature
            name: Discharge
