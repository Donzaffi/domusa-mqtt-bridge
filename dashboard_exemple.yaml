title: Domusa Heat Pump

views:
  - title: Overview
    path: domusa
    icon: mdi:heat-pump
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Operation Status
            icon: mdi:heat-pump
          - type: entities
            title: Operating Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_heating_active
                name: Heating Active
              - entity: binary_sensor.xxxxxx_dhw_preparation
                name: DHW Preparation
              - entity: binary_sensor.xxxxxx_defrost_active
                name: Defrost Active (C33)
              - entity: binary_sensor.xxxxxx_backup_source_active
                name: Backup Source Active (E2 / C41)
              - entity: binary_sensor.xxxxxx_compressor_enabled
                name: Compressor
              - entity: binary_sensor.xxxxxx_zone_1_demand
                name: Zone 1 Demand
              - entity: binary_sensor.xxxxxx_sg_ready_active
                name: SG Ready
          - type: gauge
            entity: sensor.xxxxxx_compressor_frequency
            name: Compressor Frequency
            min: 0
            max: 85
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 75

      - type: grid
        cards:
          - type: heading
            heading: Heating & Hydraulic Circuit
            icon: mdi:radiator
          - type: entities
            title: Live Temperatures
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_flow_temperature
                name: Actual Flow Temperature
              - entity: sensor.xxxxxx_return_temperature
                name: Actual Return Temperature
              - entity: sensor.domusa_delta_t
                name: Delta T
              - entity: sensor.xxxxxx_water_flow
                name: Water Flow
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor Temperature
          - type: entities
            title: Outdoor Temperature Compensation (OTC)
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_otc_enabled
                name: OTC Enabled
              - entity: sensor.xxxxxx_otc_requested_temperature
                name: OTC Requested Temperature
              - entity: sensor.xxxxxx_otc_curve
                name: OTC Curve
              - entity: sensor.xxxxxx_otc_maximum_temperature
                name: OTC Maximum Temperature
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor Temperature

          - type: history-graph
            title: Flow, Return & OTC — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.xxxxxx_flow_temperature
                name: Flow
              - entity: sensor.xxxxxx_return_temperature
                name: Return
              - entity: sensor.xxxxxx_otc_requested_temperature
                name: OTC Requested
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor Temperature

      - type: grid
        cards:
          - type: heading
            heading: DHW
            icon: mdi:water-boiler
          - type: entities
            title: DHW Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_dhw_enabled
                name: DHW Enabled
              - entity: binary_sensor.xxxxxx_dhw_preparation
                name: DHW Currently Preparing
              - entity: sensor.xxxxxx_dhw_temperature
                name: DHW Temperature
          - type: history-graph
            title: DHW Temperature — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.xxxxxx_dhw_temperature
                name: DHW Temperature

      - type: grid
        cards:
          - type: heading
            heading: Defrost & Backup Source
            icon: mdi:snowflake-melt
          - type: entities
            title: Live Status
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_defrost_active
                name: Defrost Active (C33)
              - entity: binary_sensor.xxxxxx_backup_source_active
                name: Backup Source Active (E2 / C41)
              - entity: sensor.xxxxxx_evaporator_temperature
                name: Evaporator Temperature
              - entity: sensor.xxxxxx_suction_temperature
                name: Suction Temperature
              - entity: sensor.xxxxxx_condenser_temperature
                name: Condensing Temperature
          - type: history-graph
            title: Defrost & Backup Source — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 30
            entities:
              - entity: binary_sensor.xxxxxx_defrost_active
                name: C33 Defrost
              - entity: binary_sensor.xxxxxx_backup_source_active
                name: E2 Backup Source

      - type: grid
        cards:
          - type: heading
            heading: Refrigerant Circuit
            icon: mdi:snowflake-thermometer
          - type: entities
            title: Refrigerant Measurements
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_high_refrigerant_pressure
                name: High Refrigerant Pressure
              - entity: sensor.xxxxxx_evaporator_temperature
                name: Evaporator Temperature
              - entity: sensor.xxxxxx_condenser_temperature
                name: Condensing Temperature
              - entity: sensor.xxxxxx_suction_temperature
                name: Suction Temperature
              - entity: sensor.xxxxxx_discharge_temperature
                name: Discharge Temperature
          - type: history-graph
            title: Refrigerant Temperatures — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.xxxxxx_evaporator_temperature
                name: Evaporator
              - entity: sensor.xxxxxx_condenser_temperature
                name: Condenser
              - entity: sensor.xxxxxx_suction_temperature
                name: Suction
              - entity: sensor.xxxxxx_discharge_temperature
                name: Discharge

      - type: grid
        cards:
          - type: heading
            heading: Electrical & Fans
            icon: mdi:fan
          - type: entities
            title: Domusa Measurements
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_ac_voltage
                name: AC Voltage
              - entity: sensor.xxxxxx_compressor_current
                name: Compressor Current
              - entity: sensor.xxxxxx_compressor_phase_current
                name: Compressor Phase Current
              - entity: sensor.xxxxxx_compressor_frequency
                name: Compressor Frequency
              - entity: sensor.xxxxxx_fan_1_speed
                name: Fan 1 Speed
              - entity: sensor.xxxxxx_fan_2_speed
                name: Fan 2 Speed

  - title: Diagnostics
    path: domusa-diagnostics
    icon: mdi:stethoscope
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Operating Diagnostics
            icon: mdi:clipboard-pulse
          - type: entities
            title: System State
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_heating_active
                name: Heating Active
              - entity: binary_sensor.xxxxxx_dhw_preparation
                name: DHW Preparation
              - entity: binary_sensor.xxxxxx_defrost_active
                name: Defrost Active (C33)
              - entity: binary_sensor.xxxxxx_backup_source_active
                name: Backup Source Active (E2 / C41)
              - entity: binary_sensor.xxxxxx_compressor_enabled
                name: Compressor Enabled
              - entity: binary_sensor.xxxxxx_zone_1_demand
                name: Zone 1 Demand

      - type: grid
        cards:
          - type: heading
            heading: Defrost & Backup History
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Defrost & Backup Source — Last 7 Days
            hours_to_show: 168
            refresh_interval: 300
            entities:
              - entity: binary_sensor.xxxxxx_defrost_active
                name: C33 Defrost
              - entity: binary_sensor.xxxxxx_backup_source_active
                name: E2 Backup Source

      - type: grid
        cards:
          - type: heading
            heading: Compressor Diagnostics
            icon: mdi:engine
          - type: entities
            title: Compressor
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_compressor_frequency
                name: Frequency
              - entity: sensor.xxxxxx_compressor_current
                name: Current
              - entity: sensor.xxxxxx_compressor_phase_current
                name: Phase Current
              - entity: sensor.xxxxxx_ac_voltage
                name: AC Voltage
          - type: history-graph
            title: Compressor Activity — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: binary_sensor.xxxxxx_compressor_enabled
                name: Compressor Enabled
              - entity: sensor.xxxxxx_compressor_frequency
                name: Frequency
              - entity: sensor.xxxxxx_compressor_current
                name: Current

      - type: grid
        cards:
          - type: heading
            heading: Refrigerant Diagnostics
            icon: mdi:snowflake-thermometer
          - type: entities
            title: Refrigerant
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_high_refrigerant_pressure
                name: High Pressure
              - entity: sensor.xxxxxx_evaporator_temperature
                name: Evaporator
              - entity: sensor.xxxxxx_condenser_temperature
                name: Condenser
              - entity: sensor.xxxxxx_suction_temperature
                name: Suction
              - entity: sensor.xxxxxx_discharge_temperature
                name: Discharge

      - type: grid
        cards:
          - type: heading
            heading: OTC Diagnostics
            icon: mdi:chart-bell-curve

          - type: entities
            title: Outdoor Temperature Compensation
            show_header_toggle: false
            entities:
              - entity: binary_sensor.xxxxxx_otc_enabled
                name: OTC Enabled
              - entity: sensor.xxxxxx_otc_requested_temperature
                name: Requested Temperature
              - entity: sensor.xxxxxx_otc_curve
                name: OTC Curve
              - entity: sensor.xxxxxx_otc_maximum_temperature
                name: Maximum OTC Temperature
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor Temperature

          - type: history-graph
            title: OTC Performance — Last 24 Hours
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor
              - entity: sensor.xxxxxx_otc_requested_temperature
                name: OTC Requested
              - entity: sensor.xxxxxx_flow_temperature
                name: Actual Flow

      - type: grid
        cards:
          - type: heading
            heading: Hydraulic Diagnostics
            icon: mdi:pipe
          - type: entities
            title: Hydraulic Circuit
            show_header_toggle: false
            entities:
              - entity: sensor.xxxxxx_flow_temperature
                name: Flow Temperature
              - entity: sensor.xxxxxx_return_temperature
                name: Return Temperature
              - entity: sensor.domusa_delta_t
                name: Delta T
              - entity: sensor.xxxxxx_water_flow
                name: Water Flow
              - entity: sensor.xxxxxx_outdoor_temperature
                name: Outdoor Temperature
